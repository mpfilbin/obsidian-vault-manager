[pytest]
# Pytest configuration for Library vault management tools

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# BDD configuration
bdd_features_base_dir = tests/features

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Coverage reporting
    --cov=vault_manager
    --cov-report=term-missing
    --cov-report=html:htmlcov
    # Disable warnings summary
    --disable-warnings
    # Strict markers (fail on unknown markers)
    --strict-markers

# Custom markers for organizing tests
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for command workflows
    bdd: BDD tests using pytest-bdd
    tags: Tests for tag management commands
    images: Tests for image management commands
    properties: Tests for properties management commands
    index: Tests for index management commands
    slow: Tests that take significant time to run
    requires_vault: Tests that require a real vault structure
    requires_ai: Tests that require AI API access

# Coverage options
[coverage:run]
source = .
omit =
    tests/*
    __pycache__/*
    */__pycache__/*
    */tests/*

[coverage:report]
exclude_lines =
    # Standard exclusions
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
